name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, test, audit, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck agent
        id: agent-typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee agent-typecheck.log

      - name: Post typecheck diagnostics
        if: github.event_name == 'pull_request' && steps.agent-typecheck.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('agent-typecheck.log', 'utf8').slice(-12000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `<!-- datto-ci-diagnostic -->\n### Agent typecheck failed\n\n\`\`\`text\n${log}\n\`\`\``
            });

      - name: Stop after agent typecheck failure
        if: steps.agent-typecheck.outcome == 'failure'
        run: exit 1

      - name: Typecheck Convex functions
        run: npm run convex:typecheck

      - name: Run unit tests
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build production container
        run: docker build --tag datto-agent:ci ./agent
